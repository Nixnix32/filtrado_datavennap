<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Admin Filtrado</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="btnMenu"><i class="fas fa-bars"></i></button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">FILTRADO DE DATA</div>
        <nav class="nav-links">
            <a href="#"><i class="fas fa-home"></i> Inicio</a>
            <a href="#"><i class="fas fa-folder"></i> Manual</a>
            <a href="#"><i class="fas fa-history"></i> Bitácora</a>
        </nav>
    </aside>

    <main class="contenido-principal">
        
        <section class="bienvenida mb-4">
            <div>
                <h5 class="bienvenida_admin">Bienvenido Administrador</h5>
                <div class="busqueda-rapida">
                    <i class="fas fa-search"></i>
                    <input type="text" id="inputBusqueda" placeholder="FILTRADO DINÁMICO...">
                </div>
            </div>
            <img class="Admin_imagen" src="assets/imagen_barranav.png" alt="Admin">
        </section>

        <div class="card-datos mb-4">
            <h6 class="text-secondary fw-bold mb-3">
                <i class="fas fa-database me-2"></i>Gestión de Base de Datos
            </h6>
            
            <div class="d-flex flex-wrap align-items-center gap-3">
                <div class="contenedor-selector-archivo" style="flex: 2; min-width: 280px;">
                    <input type="file" id="inputExcel" class="d-none" accept=".xlsx, .xls, .csv">
                    <div class="grupo-personalizado">
                        <button class="btn-seleccionar-archivo" type="button" id="btnSeleccionar">
                            Seleccionar Archivo
                        </button>
                        <span id="nombreArchivo">Ningún archivo seleccionado</span>
                    </div>
                </div>

                <div class="d-flex gap-2 w-100-mobile" style="flex: 1; min-width: 200px;">
                    <button class="btn-pildora btn-menta flex-fill" onclick="enviandodatos()">Cargar</button>
                    <button class="btn-pildora btn-blue flex-fill" onclick="cargarUsuariosDesdeBackend()">Mostrar</button>
                </div>
            </div>
        </div>

        <div id="loader" style="display: none; text-align: center; margin: 20px 0;">
            <div class="progress-bar-container">
                <div class="progress-oval"></div>
            </div>
            <p class="Procesando_registros">Procesando registros...</p>
        </div>

        <section id="dataWindow" class="card-datos d-none">
            <h5 class="fw-bold mb-3">Datos Procesados Dinámicamente</h5>
            
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="miTabla">
                    <thead>
                        <tr id="cabeceraTabla">
                            </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
                <small class="text-secondary" id="txtConteoPagina">Cargando datos...</small>
                <div class="d-flex gap-2">
                    <button class="btn-pildora btn-light border" id="btnAnterior" onclick="paginaAnterior()">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="btn-pildora btn-light border" id="btnSiguiente" onclick="paginaSiguiente()">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <div class="mt-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                <button class="btn-pildora btn-eliminar-outline w-100-mobile" onclick="eliminarTodo()">
                    <i class="fas fa-trash-alt me-2"></i>Eliminar Todo
                </button>

                <div class="d-flex align-items-center gap-3 flex-wrap justify-content-center">
                    <div class="bg-light p-2 px-3 rounded-3 border" id="txtCambios">
                        Sin cambios pendientes
                    </div>
                    <button class="btn-pildora btn-actualizar w-100-mobile" onclick="guardarCambiosFinales()">
                        <i class="fas fa-save me-2"></i>Actualizar Base
                    </button>
                </div>
                
                <button class="btn-pildora btn-mostaza" onclick="cargarUsuariosDesdeBackend()">
                    <i class="fas fa-sync me-1"></i> Refrescar
                </button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="funcionalidades.js"></script>
</body>
</html>
